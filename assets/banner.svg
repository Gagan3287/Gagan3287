<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030F"/>
      <stop offset="0.55" stop-color="#1E1065"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2E1065"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="280" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="30" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="70" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="25" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="55" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="22" r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="85" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="35" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="120" r="1.4"><animate attributeName="opacity" values="1;0.1;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="150" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="880" cy="75" r="62" fill="#7C3AED" opacity="0.18">
    <animate attributeName="r" values="58;68;58" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="75" r="40" fill="url(#moon)" filter="url(#glow)"/>

  <!-- mountains -->
  <path d="M0 280 L0 235 L130 205 L240 240 L360 200 L480 238 L600 208 L720 242 L840 212 L940 238 L1000 220 L1000 280 Z" fill="#1E1B4B" opacity="0.9"/>
  <path d="M0 280 L0 262 L160 245 L320 266 L500 248 L680 268 L850 250 L1000 264 L1000 280 Z" fill="#09090B"/>

  <!-- title -->
  <text x="500" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="3" fill="url(#title)" filter="url(#glow)">
    VENGALA GAGAN CHANDRA TEJ
    <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
  </text>

  <!-- subtitle -->
  <text x="500" y="152" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="19" letter-spacing="6" fill="#A78BFA">
    AI/ML  |  FULL STACK DEVELOPER
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.4s" fill="freeze"/>
  </text>

  <!-- animated divider lines -->
  <line x1="130" y1="146" x2="300" y2="146" stroke="#7C3AED" stroke-width="2" stroke-dasharray="170" stroke-dashoffset="170">
    <animate attributeName="stroke-dashoffset" from="170" to="0" begin="1s" dur="1.2s" fill="freeze"/>
  </line>
  <line x1="700" y1="146" x2="870" y2="146" stroke="#7C3AED" stroke-width="2" stroke-dasharray="170" stroke-dashoffset="170">
    <animate attributeName="stroke-dashoffset" from="170" to="0" begin="1s" dur="1.2s" fill="freeze"/>
  </line>

  <!-- code icon -->
  <text x="70" y="120" font-family="Consolas, Courier New, monospace" font-size="46" fill="#60A5FA" opacity="0.8" filter="url(#glow)">
    &lt;/&gt;
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>