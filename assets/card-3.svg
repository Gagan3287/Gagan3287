<svg xmlns="http://www.w3.org/2000/svg" width="480" height="170" viewBox="0 0 480 170">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140F2E"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="478" height="168" rx="14" fill="url(#bg)" stroke="#312E81" stroke-width="2"/>
  <rect x="1" y="1" width="478" height="5" rx="2" fill="url(#bar)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="24" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#A78BFA">StudyMate AI</text>
  <text x="24" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D4D4D8">Add a description to this repository on GitHub, then</text>
  <text x="24" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#D4D4D8">re-run the script.</text>
  <circle cx="30" cy="142" r="6" fill="#60A5FA">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#E4E4E7">TypeScript</text>
  <text x="170" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#E4E4E7">&#9733; 0</text>
  <text x="230" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#E4E4E7">Forks 0</text>
  <text x="456" y="147" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#A78BFA">View repository &#8594;</text>
</svg>