      <stop offset="0" stop-color="#140F2E"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="478" height="198" rx="14" fill="url(#bg)" stroke="#312E81" stroke-width="2"/>
  <text x="24" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#A78BFA">GitHub Stats</text>
