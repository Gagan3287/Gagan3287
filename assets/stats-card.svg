    <text x="24" y="144" fill="#D4D4D8">Following</text>
    <text x="456" y="144" text-anchor="end" font-weight="700" fill="#60A5FA">0</text>
    <text x="24" y="174" fill="#D4D4D8">Total Stars Earned</text>
    <text x="456" y="174" text-anchor="end" font-weight="700" fill="#60A5FA">0</text>
